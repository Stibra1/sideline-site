<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" role="img" aria-label="Illustration: a ball goes in the goal, a notice of +20 kr to the team, and the team kitty fills up">
<title>Illustration: a ball goes in the goal, a notice of +20 kr to the team, and the team kitty fills up</title>
<defs>
 <radialGradient id="glow" cx="50%" cy="42%" r="50%"><stop offset="0" stop-color="#FF6100" stop-opacity=".34"/><stop offset=".6" stop-color="#FF6100" stop-opacity=".07"/><stop offset="1" stop-color="#FF6100" stop-opacity="0"/></radialGradient>
 <linearGradient id="turf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0d05"/><stop offset="1" stop-color="#2a1205"/></linearGradient>
 <linearGradient id="fadeg" x1="0" y1="214" x2="0" y2="452" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <mask id="fade"><rect width="600" height="460" fill="url(#fadeg)"/></mask>
 <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#FF6100"/><stop offset="1" stop-color="#FFB27A"/></linearGradient>
 <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".7"/></filter>
</defs>
<style>
 text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,Arial,sans-serif}
 .ln{fill:none;stroke:#FF6100;stroke-opacity:.55;stroke-width:2;stroke-linejoin:round}
 .net{fill:none;stroke:#F5F5F3;stroke-opacity:.22;stroke-width:1}
 .chip rect{fill:#141414;stroke:#2c2c2c}
 .chip .k{fill:#A1A19D;font-size:13px;font-weight:600}
 .chip .v{fill:#FF8A45;font-size:15px;font-weight:800}
 .ball{animation:shot 4.4s cubic-bezier(.3,.1,.4,1) infinite}
 .flash{animation:flash 4.4s ease-out infinite;opacity:0}
 .toast{animation:toast 4.4s cubic-bezier(.2,.9,.3,1.3) infinite;opacity:0;transform-origin:300px 70px}
 .plus{animation:plus 4.4s ease-out infinite;opacity:0}
 .fill{animation:fill 4.4s ease-in-out infinite;transform-origin:0 0}
 .num2{animation:n2 4.4s steps(1) infinite;opacity:0} .num1{animation:n1 4.4s steps(1) infinite}
 .c1{animation:float 6s ease-in-out infinite} .c2{animation:float 6s ease-in-out -2s infinite} .c3{animation:float 6s ease-in-out -4s infinite}
 @keyframes shot{0%{transform:translate(170px,400px) scale(1);opacity:0}6%{opacity:1}30%{transform:translate(215px,258px) scale(.78)}48%{transform:translate(268px,196px) scale(.6)}56%{transform:translate(292px,198px) scale(.52)}80%{transform:translate(296px,206px) scale(.52);opacity:1}88%,100%{transform:translate(296px,206px) scale(.52);opacity:0}}
 @keyframes flash{0%,54%{opacity:0}58%{opacity:.9}80%{opacity:0}100%{opacity:0}}
 @keyframes toast{0%,56%{opacity:0;transform:translateY(-14px) scale(.92)}62%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateY(-8px)}}
 @keyframes plus{0%,57%{opacity:0;transform:translate(0,0)}62%{opacity:1}86%{opacity:0;transform:translate(0,-46px)}100%{opacity:0}}
 @keyframes fill{0%,58%{transform:scaleX(.72)}68%,94%{transform:scaleX(.8)}100%{transform:scaleX(.72)}}
 @keyframes n1{0%{opacity:1}60%{opacity:0}96%{opacity:1}}
 @keyframes n2{0%{opacity:0}60%{opacity:1}96%{opacity:0}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
 @media (prefers-reduced-motion:reduce){
  .ball,.flash,.toast,.plus,.fill,.num1,.num2,.c1,.c2,.c3{animation:none}
  .ball{transform:translate(292px,198px) scale(.52)} .toast{opacity:1} .num1{opacity:0} .num2{opacity:1} .fill{transform:scaleX(.8)}
 }
</style>
<rect width="600" height="460" fill="url(#glow)"/>

<!-- pitch in perspective -->
<g mask="url(#fade)">
<path d="M40 452 L170 214 H430 L560 452 Z" fill="url(#turf)"/>
<g class="ln">
 <path d="M40 452 L170 214 H430 L560 452"/>
 <path d="M226 214 L214 252 H386 L374 214"/>
 <path d="M106 330 H494"/>
 <ellipse cx="300" cy="330" rx="62" ry="17"/>
 <path d="M248 252 Q300 270 352 252"/>
</g>
</g>

<!-- goal -->
<g>
 <path class="net" d="M256 214 V176 M268 214 V176 M280 214 V176 M292 214 V176 M304 214 V176 M316 214 V176 M328 214 V176 M340 214 V176 M246 206 H354 M246 196 H354 M246 186 H354"/>
 <path d="M244 214 V172 H356 V214" fill="none" stroke="#F5F5F3" stroke-width="4" stroke-linejoin="round"/>
 <ellipse class="flash" cx="300" cy="196" rx="64" ry="30" fill="#FF6100" fill-opacity=".55"/>
</g>

<!-- ball (drawn at the origin, moved by the animation) -->
<g class="ball">
 <circle r="17" fill="#F5F5F3"/>
 <path d="M0 -6 L6 -2 L4 5 H-4 L-6 -2 Z" fill="#111"/>
 <path d="M0 -6 V-16 M6 -2 L15 -6 M4 5 L9 13 M-4 5 L-9 13 M-6 -2 L-15 -6" stroke="#111" stroke-width="1.6"/>
</g>
<text class="plus" x="300" y="160" text-anchor="middle" fill="#FF8A45" font-size="26" font-weight="900">+20 kr</text>

<!-- notification -->
<g class="toast" filter="url(#soft)">
 <rect x="160" y="34" width="280" height="62" rx="18" fill="#161616" stroke="#2e2e2e"/>
 <rect x="174" y="47" width="36" height="36" rx="9" fill="#FF6100"/>
 <circle cx="192" cy="65" r="11" fill="#F5F5F3"/><path d="M192 60.5 L196.3 63.6 L194.7 68.6 H189.3 L187.7 63.6 Z" fill="#111"/>
 <text x="222" y="62" fill="#F5F5F3" font-size="16" font-weight="800">Goal! 2–1</text>
 <text x="222" y="82" fill="#A1A19D" font-size="14" font-weight="600">+20 kr to the team</text>
</g>

<!-- pledge chips -->
<g class="chip c1"><rect x="18" y="124" width="132" height="52" rx="14"/><text class="k" x="34" y="145">Per goal</text><text class="v" x="34" y="165">20 kr</text></g>
<g class="chip c2"><rect x="20" y="194" width="112" height="52" rx="14"/><text class="k" x="36" y="215">Win</text><text class="v" x="36" y="235">50 kr</text></g>
<g class="chip c3"><rect x="452" y="128" width="132" height="52" rx="14"/><text class="k" x="468" y="149">Clean sheet</text><text class="v" x="468" y="169">30 kr</text></g>

<!-- team kitty -->
<g filter="url(#soft)">
 <rect x="372" y="336" width="210" height="102" rx="20" fill="#121212" stroke="#2c2c2c"/>
 <text x="392" y="362" fill="#A1A19D" font-size="12" font-weight="800" letter-spacing="1.4">TEAM KITTY</text>
 <text class="num1" x="392" y="394" fill="#F5F5F3" font-size="28" font-weight="900" style="font-variant-numeric:tabular-nums">12 460 kr</text>
 <text class="num2" x="392" y="394" fill="#F5F5F3" font-size="28" font-weight="900" style="font-variant-numeric:tabular-nums">12 480 kr</text>
 <rect x="392" y="406" width="170" height="8" rx="4" fill="#262626"/>
 <g transform="translate(392 406)"><rect class="fill" width="170" height="8" rx="4" fill="url(#bar)"/></g>
 <text x="392" y="430" fill="#6B6B68" font-size="11" font-weight="600">38 supporters</text>
</g>

<!-- scoreboard -->
<g filter="url(#soft)">
 <rect x="18" y="364" width="150" height="70" rx="16" fill="#121212" stroke="#2c2c2c"/>
 <text x="50" y="386" fill="#6B6B68" font-size="10" font-weight="800" letter-spacing="1" text-anchor="middle">HOME</text>
 <text x="136" y="386" fill="#6B6B68" font-size="10" font-weight="800" letter-spacing="1" text-anchor="middle">AWAY</text>
 <text class="num1" x="50" y="420" fill="#FF6100" font-size="32" font-weight="900" text-anchor="middle">1</text>
 <text class="num2" x="50" y="420" fill="#FF6100" font-size="32" font-weight="900" text-anchor="middle">2</text>
 <text x="93" y="417" fill="#3a3a3a" font-size="24" font-weight="900" text-anchor="middle">–</text>
 <text x="136" y="420" fill="#F5F5F3" font-size="32" font-weight="900" text-anchor="middle">1</text>
</g>
</svg>
